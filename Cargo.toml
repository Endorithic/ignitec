[package]
name = "ignitec"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
owo-colors = "4.3.0"

[lints.clippy]
redundant_field_names = "allow"

[profile.performance]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
debug = false
strip = true
